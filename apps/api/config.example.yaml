# Sample configuration for @base/api.
# Copy to config.yaml and tweak. Environment variables ALWAYS override values here.
#
# The structured form (database.url, cache.url, ...) is preferred. Flat keys
# (DATABASE_URL: ...) also work as a fallback for backwards compatibility.

app:
  node_env: development
  port: 3000
  admin_port: 9090
  url: http://localhost:3000
  log_level: debug
  cookie_secret: dev-only-cookie-secret-change-me-32-chars-min
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173

database:
  url: postgresql://app:app@localhost:5432/app
  pool_max: 10

cache:
  url: redis://localhost:6379

# kafka:
#   brokers: localhost:9092
#   client_id: app

telemetry:
  service_name: app
  # otlp_endpoint: http://otel-collector:4317
