# Sample configuration for @base/api.
# Copy to config.yaml and tweak. Environment variables ALWAYS override values here.
#
# The structured form (database.url, cache.url, ...) is preferred. Flat keys
# (DATABASE_URL: ...) also work as a fallback for backwards compatibility.
# A key no registry entry has, or a value of the wrong type, fails the start
# with the list of problems (and a "did you mean" for a typo).

app:
  node_env: development
  port: 3000
  admin_port: 9091          # `just dev` passes the same; 9090 in a container
  url: http://localhost:3000
  log_level: debug
  cookie_secret: dev-only-cookie-secret-change-me-32-chars-min
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
  # disabled_integrations: [valkey, kafka]   # run on Postgres alone (README "Optional integrations")

database:
  url: postgresql://app:app@localhost:5432/app
  pool_max: 10

cache:
  url: redis://localhost:6379

# kafka:
#   brokers: localhost:9092
#   client_id: my-service      # default: OTEL_SERVICE_NAME
#   security_protocol: sasl_ssl
#   sasl:
#     mechanism: SCRAM-SHA-512
#     username: my-service
#     password_file: /run/secrets/kafka-password
#
# Every key, its YAML path and its default: packages/config/src/env.registry.ts
# (the running values, secrets redacted: GET /admin/config on the admin port).

# Telemetry is configured by the ENVIRONMENT only — it starts before this file
# is read: OTEL_SERVICE_NAME (default nodejs-basics-api), OTEL_EXPORTER_OTLP_ENDPOINT
# (default http://localhost:4317), SENTRY_DSN, PYROSCOPE_SERVER_ADDRESS.

# Diagnostics (heap snapshots, crash reports). All keys optional —
# without an S3 bucket files are written to /tmp only.
# diagnostics:
#   s3_bucket: my-diagnostics-bucket
#   heap_snapshot_prefix: heap-snapshots
#   crash_report_prefix: crash-reports
#   heap_oom_threshold: "0.85"
#   heap_oom_poll_ms: "10000"
