name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: nodejs-basics-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: nodejs-basics-${{ matrix.app }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.app }}.json

      - name: CVE scan (grype, fail on high)
        uses: anchore/scan-action@v4
        with:
          image: nodejs-basics-${{ matrix.app }}:ci
          fail-build: true
          severity-cutoff: high
        env:
          GRYPE_CONFIG: .grype.yaml
          GRYPE_DB_VALIDATE_AGE: "false"

      # Push only on master / tags — wire to your registry of choice.
