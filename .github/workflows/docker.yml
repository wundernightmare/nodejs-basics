name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Read-only until the push step below is enabled — then add `packages: write`
# to *that* job only (never at workflow level for pull requests).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same names as .env.example / the GitLab variables; empty = public upstream.
env:
  DOCKER_HUB: ${{ vars.DOCKER_HUB || 'docker.io' }}
  GCR: ${{ vars.GCR || 'gcr.io' }}
  GRYPE_DB_UPDATE_URL: ${{ vars.GRYPE_DB_UPDATE_URL }}
  GRYPE_DB_AUTO_UPDATE: ${{ vars.GRYPE_DB_AUTO_UPDATE }}
  # Accept the bundled vuln DB even if older than grype's 5-day default
  # (CI's clock can run ahead of the latest published DB).
  GRYPE_DB_VALIDATE_AGE: "false"

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      SYFT_VERSION: ${{ steps.pins.outputs.SYFT_VERSION }}
      GRYPE_VERSION: ${{ steps.pins.outputs.GRYPE_VERSION }}
      APPS: ${{ steps.apps.outputs.APPS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: scripts/mise-pins.sh >> "$GITHUB_OUTPUT"
      # Every apps/<name>/Dockerfile is an image to build.
      - id: apps
        run: |
          echo "APPS=$(find apps -mindepth 2 -maxdepth 2 -name Dockerfile -exec dirname {} \; | xargs -n1 basename | sort | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.versions.outputs.APPS) }}
    env:
      APP: ${{ matrix.app }}
      SYFT_VERSION: ${{ needs.versions.outputs.SYFT_VERSION }}
      GRYPE_VERSION: ${{ needs.versions.outputs.GRYPE_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: nodejs-basics-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # syft + grype from the same version-pinned images as the GitLab job,
      # against a `docker save` tar — identical commands, identical findings.
      - name: SBOM (syft) + CVE scan (grype, fail on high)
        run: |
          docker save -o "image-$APP.tar" "nodejs-basics-$APP:ci"
          docker run --rm -v "$PWD:/w" -w /w \
            "${DOCKER_HUB}/anchore/syft:v${SYFT_VERSION}" \
            "docker-archive:image-$APP.tar" -o "cyclonedx-json=sbom-$APP.json"
          # Forward only the grype knobs that are actually set (an empty
          # GRYPE_DB_UPDATE_URL would override grype's default with "").
          pass=(); for v in GRYPE_DB_VALIDATE_AGE GRYPE_DB_UPDATE_URL GRYPE_DB_AUTO_UPDATE HTTPS_PROXY NO_PROXY; do
            [ -n "${!v:-}" ] && pass+=(-e "$v")
          done
          docker run --rm -v "$PWD:/w" -w /w "${pass[@]}" \
            "${DOCKER_HUB}/anchore/grype:v${GRYPE_VERSION}" \
            "docker-archive:image-$APP.tar" --config .grype.yaml --fail-on high

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.json
          retention-days: 7

      # Push only happens on master / tags — wire to your registry of choice
      # and give this job `permissions: packages: write`.
      # - name: Login + push
      #   if: github.event_name == 'push'
      #   uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      #   with:
      #     context: .
      #     file: apps/${{ matrix.app }}/Dockerfile
      #     push: true
      #     tags: ghcr.io/wundernightmare/nodejs-basics-${{ matrix.app }}:latest
