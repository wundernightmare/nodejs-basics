# mise tool versions for local development.
#
# Pins the toolchain so clones / CI all resolve the same binaries. Node + pnpm
# drive the workspace; k6 drives the load tests. The AppSec toolchain
# (semgrep / gitleaks / osv-scanner / hadolint / syft / grype / cosign) is
# installed by `just setup-sec`; checks run via `just sec` and the docker-scan
# recipes. Versions mirror the golang-basics / rust-basics sibling repos so the
# family drifts together.

[tools]
node = "22.15"
k6   = "0.56.0"

# AppSec — pinned for reproducibility. Bump here, then re-run `just setup-sec`.
# Each `just sec-*` recipe invokes its tool via `mise exec --`.
semgrep     = "1.163.0"
gitleaks    = "8.30.1"
osv-scanner = "2.3.8"
hadolint    = "2.14.0"

# Container CVE / SBOM — used by `just docker-scan` / `docker-scan-ci`.
syft  = "1.44.0"
grype = "0.112.0"

# Supply-chain signing — cosign in key-mode with `--tlog-upload=false`.
cosign = "3.0.6"
