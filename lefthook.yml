# Git hooks. Install once after cloning:
#   pnpm install
#   pnpm lefthook install
#
# Skip a single invocation with `LEFTHOOK=0 git commit ...` only if
# absolutely necessary — CI runs the same checks.

# ── pre-commit ──────────────────────────────────────────────────────────────
# Fast correctness gates.
pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm -r format:check
    lint:
      run: pnpm -r lint
    typecheck:
      run: pnpm -r typecheck
    secrets:
      # Staged-diff secret scan — the same rules CI runs over the whole tree.
      # gitleaks is pinned in mise.toml (`just setup-sec`).
      run: mise exec -- gitleaks git --pre-commit --staged --config .gitleaks.toml --no-banner

# ── pre-push ────────────────────────────────────────────────────────────────
# Heavier checks — too slow for every commit, fast enough before a push.
# Unit tests only (`pnpm test` is the vitest unit layer; the container-backed
# integration suites and e2e run in CI).
pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm -r typecheck
    test:
      run: pnpm test
