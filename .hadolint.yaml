# hadolint config — Dockerfile linting for every apps/*/Dockerfile.
# Run via `just sec-iac` (and the `hadolint` CI job, from the pinned
# hadolint image). The severity gate is `failure-threshold` below; CI does not
# override it.
ignored:
  - DL3059 # multiple consecutive RUN — readability over layer-count here
  - DL3016 # pin npm versions — pnpm is pinned via corepack prepare pnpm@<ver>

failure-threshold: warning

# Registries a FROM may pull from. Add your pull-through cache here when you
# override DOCKER_HUB / GCR / GHCR in a closed network (see .env.example).
trustedRegistries:
  - docker.io
  - gcr.io
  - ghcr.io
  # - harbor.internal
