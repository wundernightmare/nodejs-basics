# Observability stack: OTel Collector → Jaeger v2 (traces), Prometheus (metrics).
#
# Attaches to the deps network as `external: true`. Bring `deps.yml` up first.
#
# Usage:
#   just obs        |  docker compose -f docker/observability.yml up -d
#   just down-obs   |  docker compose -f docker/observability.yml down
#
# UIs:
#   Jaeger      http://localhost:16686
#   Prometheus  http://localhost:9090

name: nodejs-basics-obs

services:
  otel-collector:
    image: ${DOCKER_HUB:-docker.io}/otel/opentelemetry-collector-contrib:0.161.0
    container_name: nodejs-basics-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro,z   # z: SELinux label (Fedora/RHEL), no-op elsewhere
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - deps

  jaeger:
    # Jaeger v2 (the 1.x all-in-one image is end-of-life): its default
    # all-in-one config takes OTLP on 4317/4318 inside the network, which is
    # where the collector exports; only the UI is published.
    image: ${DOCKER_HUB:-docker.io}/jaegertracing/jaeger:2.21.0
    container_name: nodejs-basics-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # UI
    networks:
      - deps

  prometheus:
    image: ${DOCKER_HUB:-docker.io}/prom/prometheus:v3.14.0
    container_name: nodejs-basics-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    networks:
      - deps

volumes:
  prometheus_data:

networks:
  deps:
    name: nodejs-basics-deps_default
    external: true
