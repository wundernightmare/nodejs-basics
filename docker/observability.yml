# Observability stack: OTel Collector → Jaeger v2 (traces), Prometheus (metrics),
# Grafana (one provisioned dashboard over both).
#
# Attaches to the deps network as `external: true`. Bring `deps.yml` up first.
#
# Usage:
#   just obs        |  docker compose -f docker/observability.yml up -d
#   just down-obs   |  docker compose -f docker/observability.yml down
#
# UIs:
#   Jaeger      http://localhost:16686
#   Prometheus  http://localhost:9090   (scrapes the apps' admin ports 9091 / 9093)
#   Grafana     http://localhost:3001   (anonymous viewer; admin / admin)

name: nodejs-basics-obs

services:
  otel-collector:
    image: ${DOCKER_HUB:-docker.io}/otel/opentelemetry-collector-contrib:0.161.0
    container_name: nodejs-basics-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro,z   # z: SELinux label (Fedora/RHEL), no-op elsewhere
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - deps

  jaeger:
    # Jaeger v2 (the 1.x all-in-one image is end-of-life): its default
    # all-in-one config takes OTLP on 4317/4318 inside the network, which is
    # where the collector exports; only the UI is published.
    image: ${DOCKER_HUB:-docker.io}/jaegertracing/jaeger:2.21.0
    container_name: nodejs-basics-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # UI
    networks:
      - deps

  prometheus:
    image: ${DOCKER_HUB:-docker.io}/prom/prometheus:v3.14.0
    container_name: nodejs-basics-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    # The scrape targets are the apps' host ports (prometheus.yml); Docker on
    # Linux only resolves host.docker.internal with this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deps

  grafana:
    image: ${DOCKER_HUB:-docker.io}/grafana/grafana:12.4.11
    container_name: nodejs-basics-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nodejs-basics.json
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro,z
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports:
      - "3001:3000" # the api owns host 3000
    depends_on: [prometheus, jaeger]
    networks:
      - deps

volumes:
  prometheus_data:

networks:
  deps:
    name: nodejs-basics-deps_default
    external: true
