# Observability stack: Jaeger (traces), Prometheus + VictoriaMetrics (metrics).
#
# Attaches to the deps network as `external: true`. Bring `deps.yml` up first.
#
# Usage:
#   just obs        |  docker compose -f docker/observability.yml up -d
#   just down-obs   |  docker compose -f docker/observability.yml down
#
# UIs:
#   Jaeger      http://localhost:16686
#   Prometheus  http://localhost:9090

name: nodejs-basics-obs

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: nodejs-basics-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - deps

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: nodejs-basics-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "14250:14250" # gRPC ingest from collector
    networks:
      - deps

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nodejs-basics-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - deps

volumes:
  prometheus_data:

networks:
  deps:
    name: nodejs-basics-deps_default
    external: true
