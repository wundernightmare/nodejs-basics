packages:
  - 'packages/*'
  - 'apps/*'
  - 'api'
  - 'e2e'

# pnpm (11+) no longer reads the `pnpm` field in package.json — overrides and
# build-script approvals live here now (see https://pnpm.io/settings).

# Overrides are floors, written as caret ranges: `pnpm update` still moves them
# inside the major, and the release-age window still applies. Two kinds:
# - one copy of a package whose types cross package boundaries (duplicate
#   fastify / zod / OTel copies make structurally identical types unassignable);
# - transitive CVEs pinned out (see CLAUDE.md "AppSec"); waivers that can't be
#   pinned out go in osv-scanner.toml / .grype.yaml instead.
# Drop an entry once `pnpm why -r <name>` shows nothing, or the dependents
# already require the floor.
overrides:
  fastify: ^5.12.5
  zod: ^4.6.5
  '@types/pg': ^8.23.1
  '@opentelemetry/core': ^2.11.0
  '@opentelemetry/exporter-prometheus': ^0.222.0
  protobufjs: ^8.8.0              # via @grpc/proto-loader → OTLP gRPC exporter
  fast-uri: ^4.1.3                # via ajv → fastify / Nest
  brace-expansion: ^5.0.9         # via minimatch
  browserslist: ^4.28.7           # GHSA (2 HIGH) via @stryker-mutator → @babel/core
  baseline-browser-mapping: ^2.11.21 # same chain
  js-yaml: ^4.3.2                 # GHSA-2883-xcg3-v3hh via openapi-typescript → @redocly/openapi-core
  qs: ^6.16.0                     # GHSA-4mjr-xmp4-gh2g / x5fp-wj9c-mxmx / q8mj-m7cp-5q26 via @stryker-mutator/core → typed-rest-client

# Peers declared older than what we run, checked to work (drop an entry once
# the package widens its range): @sentry/nestjs and nestjs-zod predate NestJS
# 12 — without the rule pnpm auto-installs a second @nestjs/core 11 for Sentry,
# whose SentryGlobalFilter then extends the wrong BaseExceptionFilter.
peerDependencyRules:
  allowedVersions:
    '@sentry/nestjs>@nestjs/core': '12'
    '@sentry/nestjs>@nestjs/common': '12'
    'nestjs-zod>@nestjs/common': '12'
    'openapi-typescript>typescript': '6'   # api/ holds TypeScript 6 for it (see api/package.json)

# pnpm (11+) turns an ignored build script into a hard install failure.
allowBuilds:
  '@confluentinc/kafka-javascript': true
  '@datadog/pprof': true
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  libpq: true
  msgpackr-extract: true
  pg-native: true

# Supply-chain hardening (semgrep p/owasp-top-ten `package_managers.pnpm.*`
# enforces all three; `.npmrc` `min-release-age=7` is the npm twin). A
# frozen-lockfile install of an already-compliant lockfile is unaffected; they
# bite on `pnpm update` / a fresh resolution:
# - a newly published version has to be 7 days old before it resolves — the
#   window in which the recent npm worm packages were pulled;
# - transitive deps may only come from the registry (no git / tarball URLs);
# - a dependency update cannot silently downgrade these settings.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# The escape hatch when a release is needed before the window closes: a
# time-boxed exclusion with the reason and a `Remove after YYYY-MM-DD` line —
# scripts/check-waivers.sh (`just sec`, CI sast, nightly) fails once that date
# has passed. Example (the @opentelemetry 2.11.0 / 0.222.0 releases of
# 2026-08-31 needed this for a week):
#
# minimumReleaseAgeExclude:
#   # CVE floor, released 2026-08-31. Remove after <release date + 7 days>.
#   - '@opentelemetry/core@2.11.0'
